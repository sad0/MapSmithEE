name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead. Screenshots help a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MapSmithEE version
      placeholder: 0.1.0
  - type: input
    id: game
    attributes:
      label: Game (if it is about the area in the game)
      placeholder: BGEE 2.6.6, EET...
