[package]
name = "mapsmithee"
version = "0.2.3"
description = "Infinity Engine area viewer and editor"
authors = ["sad0"]
edition = "2024"

[lib]
name = "mapsmithee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
flate2 = "1.1.10"
png = "0.17"
base64 = "0.22"
memmap2 = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
sha2 = "0.11.1"
hex = "0.4.3"
zip = "9.1.0"
tokio = { version = "1", features = ["rt", "macros"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
