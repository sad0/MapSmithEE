<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a1b"/>
      <stop offset="1" stop-color="#1c140d"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8945a"/>
      <stop offset="0.25" stop-color="#f3e2b8"/>
      <stop offset="0.6" stop-color="#e2c68f"/>
      <stop offset="1" stop-color="#9c7a45"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e7eb"/>
      <stop offset="0.45" stop-color="#9aa3ac"/>
      <stop offset="1" stop-color="#555d65"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e4520"/>
      <stop offset="0.45" stop-color="#b47b3f"/>
      <stop offset="1" stop-color="#6a421d"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="992" height="992" rx="190" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="168" fill="none" stroke="#c8963e" stroke-opacity="0.55" stroke-width="12"/>

  <!-- rolled map, bottom-left to top-right -->
  <g transform="translate(512 512) scale(0.9) rotate(-45)">
    <rect x="-430" y="-105" width="860" height="210" rx="18" fill="url(#roll)" stroke="#5a3c1c" stroke-width="16"/>
    <!-- a strip of the map drawn on the outer turn -->
    <path d="M-330 40 C-230 -10 -150 50 -60 10 S110 -40 200 20 S300 30 340 -10" fill="none" stroke="#8e2f1f" stroke-width="13" stroke-dasharray="30 18" stroke-linecap="round"/>
    <path d="M-300 -50 C-200 -30 -120 -70 -20 -45" fill="none" stroke="#4f7a99" stroke-width="10" stroke-linecap="round"/>
    <!-- rolled ends -->
    <ellipse cx="-430" cy="0" rx="56" ry="112" fill="#d7b77a" stroke="#5a3c1c" stroke-width="16"/>
    <ellipse cx="-430" cy="0" rx="26" ry="56" fill="#9c7a45" stroke="#5a3c1c" stroke-width="10"/>
    <ellipse cx="430" cy="0" rx="56" ry="112" fill="#d7b77a" stroke="#5a3c1c" stroke-width="16"/>
    <ellipse cx="430" cy="0" rx="26" ry="56" fill="#9c7a45" stroke="#5a3c1c" stroke-width="10"/>
    <!-- ribbon -->
    <rect x="-34" y="-112" width="68" height="224" fill="#8e2f1f" stroke="#4a160d" stroke-width="10"/>
  </g>

  <!-- hammer, bottom-right to top-left, in front -->
  <g transform="translate(540 540) scale(0.86) rotate(-45)">
    <rect x="-46" y="-330" width="92" height="790" rx="36" fill="url(#wood)" stroke="#3a220d" stroke-width="16"/>
    <rect x="-46" y="360" width="92" height="40" fill="#3a220d" opacity="0.45"/>
    <g transform="translate(0 -360)">
      <rect x="-230" y="-95" width="460" height="190" rx="26" fill="url(#steel)" stroke="#262a2f" stroke-width="18"/>
      <rect x="-268" y="-80" width="60" height="160" rx="14" fill="#7d868f" stroke="#262a2f" stroke-width="16"/>
      <rect x="208" y="-80" width="60" height="160" rx="14" fill="#7d868f" stroke="#262a2f" stroke-width="16"/>
      <rect x="-60" y="-95" width="120" height="190" fill="#000" opacity="0.12"/>
    </g>
  </g>
</svg>
